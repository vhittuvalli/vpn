name: release

# Push a tag like v0.2.0 to build everything and publish a GitHub release:
# VPN-<version>.dmg (the Mac app), command-line archives for macOS and
# Linux, and checksums.txt covering all of them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: scripts/release.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli
          path: dist/*.tar.gz

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: scripts/macapp.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-app
          path: dist/*.dmg

  publish:
    needs: [cli, mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job creates the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.dmg *.tar.gz > checksums.txt && cat checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
